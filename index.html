<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <title>Kompte</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-192.png">
  <link rel="apple-touch-icon" href="icons/app-192.png">
  <link rel="stylesheet" href="style.css?v=41">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/app-192.png" alt=""><span>KOMPTE</span></div>
    <button id="switch" class="sync compte" type="button" aria-label="Changer de compte" hidden></button>
    <button id="sync" class="sync" type="button" aria-label="Actualiser"></button>
  </header>
  <main id="view"></main>
  <nav id="tabs" class="tabs" hidden>
    <button type="button" data-tab="dashboard">Accueil</button>
    <button type="button" data-tab="transactions">Transactions</button>
    <button type="button" data-tab="fixed">Fixes</button>
    <button type="button" data-tab="savings">Épargne</button>
    <button type="button" data-tab="check">Vérifier</button>
    <button type="button" data-tab="account">Réglages</button>
  </nav>
  <button id="fab" class="fab" type="button" aria-label="Nouvelle transaction" hidden>+</button>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <form class="sheet-panel" id="sheet-form" novalidate></form>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="app.js?v=41"></script>
</body>
</html>
