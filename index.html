<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <title>Kompte</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-192.png">
  <link rel="apple-touch-icon" href="icons/app-192.png">
  <script>
    // Thème choisi sur ce téléphone, appliqué avant l'affichage (pas d'éclair de l'autre thème).
    try {
      var t = (JSON.parse(localStorage.getItem('kompte-prefs') || '{}').theme) || 'dark';
      document.documentElement.dataset.theme = t;
      var c = { rose: '#ffe3f0', halloween: '#1a0f24', noel: '#0f3d2a', ocean: '#0a2540', tropical: '#e8fbef', cyber: '#07060f' }[t];
      if (c) document.querySelector('meta[name=theme-color]').content = c;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css?v=58">
</head>
<body>
  <div id="deco" class="deco" aria-hidden="true"></div>
  <header class="top">
    <button id="home" class="brand" type="button" aria-label="Retour à l'accueil"><img src="icons/app-192.png" alt=""><span id="home-text">KOMPTE</span></button>
    <button id="switch" class="sync compte" type="button" aria-label="Changer de compte" hidden></button>
    <button id="sync" class="sync" type="button" aria-label="Actualiser"></button>
  </header>
  <main id="view"></main>
  <nav id="tabs" class="tabs" hidden>
    <button type="button" data-tab="menu"><span class="ti">🏠</span>Accueil</button>
    <button type="button" data-tab="dashboard"><span class="ti">📊</span>Mon mois</button>
    <button type="button" data-tab="transactions"><span class="ti">📋</span>Opérations</button>
    <button type="button" data-tab="savings"><span class="ti">🐷</span>Épargne</button>
    <button type="button" data-tab="account"><span class="ti">⚙️</span>Réglages</button>
  </nav>
  <button id="fab" class="fab" type="button" aria-label="Nouvelle transaction" hidden>+</button>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <form class="sheet-panel" id="sheet-form" novalidate></form>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="app.js?v=58"></script>
</body>
</html>
